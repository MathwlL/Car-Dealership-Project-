<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarMark</title>

    <link rel="stylesheet" href="css/Home.css" />

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>

    <div class="Section-Front">
        <img class="background-hero" src="Imgs/beautiful-shot-snowy-mountain-sunset.jpg" />

        <div class="hero-text">
            <h1>The Future Is in Your Hands</h1>
            <p>Learn more about us</p>
            <a class="btn btn-light" href="privacy.html">About Us</a>
        </div>

        <div class="hero-model">
            <model-viewer src="models/Car.glb"
                          auto-rotate
                          camera-controls
                          disable-zoom
                          touch-action="pan-y">
            </model-viewer>
        </div>

        <img class="Linhas1" src="Imgs/Effects/EffectRedLine.png" alt="Effect Line" />
        <img class="Linhas2" src="Imgs/Effects/EffectRedLine.png" alt="Effect Line" />
    </div>

    <hr />

    <div class="Random-Ad">
        <img src="Imgs/ADPlaceHolder.png" alt="Advertisement Placeholder" />
    </div>

    <hr />

    <h2>Discover our vehicles</h2>

    <div class="filter-buttons">
        <button data-filter="all" class="active">All</button>
        <button data-filter="suv">SUVs</button>
        <button data-filter="sedan">Sedans</button>
    </div>

    <div class="Vehicles">

        <div class="card sedan">
            <img src="Imgs/Cars/HONDA_CIVIC.png" alt="Honda Civic">
            <h4>Honda Civic</h4>
        </div>

        <div class="card suv">
            <img src="Imgs/Cars/CHEVROLET_TRACKER.png" alt="Tracker">
            <h4>Tracker</h4>
        </div>

        <div class="card suv">
            <img src="Imgs/Cars/CHEVROLET_EQUINOX.png" alt="Equinox">
            <h4>Equinox</h4>
        </div>

        <div class="card suv">
            <img src="Imgs/Cars/CHEVROLET_TRAILBLAZER.png" alt="Trailblazer">
            <h4>Trailblazer</h4>
        </div>

    </div>

    <hr />

    <div class="faq-container">

        <div class="faq-title">
            Frequently Asked Questions
        </div>

        <div class="faq-item">
            <div class="faq-question">
                What is our service about?
                <span class="icon">⌄</span>
            </div>

            <div class="faq-answer">
                Lorem Ipsum
            </div>
        </div>

        <div class="faq-item">
            <div class="faq-question">
                How can I contact support?
                <span class="icon">⌄</span>
            </div>

            <div class="faq-answer">
                Lorem Ipsum
            </div>
        </div>

        <div class="faq-item">
            <div class="faq-question">
                Do you offer refunds?
                <span class="icon">⌄</span>
            </div>

            <div class="faq-answer">
                Lorem Ipsum
            </div>
        </div>

    </div>

    <script src="js/Home.js"></script>

</body>
</html>
